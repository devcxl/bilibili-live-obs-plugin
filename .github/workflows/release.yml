name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake ninja-build g++ pkg-config \
            libobs-dev \
            qt6-base-dev qt6-websockets-dev qt6-multimedia-dev \
            libcurl4-openssl-dev libqrencode-dev libssl-dev \
            libbrotli-dev

      - name: configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: build
        run: cmake --build build

      - name: package deb
        run: |
          cd build
          cpack -G DEB

      - name: upload deb
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-live-obs-deb
          path: build/bilibili-live-obs_*.deb

  release:
    needs: [build-deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            *.deb
          generate_release_notes: true